<div class="manage-card editing">
  <form hx-put="/categories/{{ cat.id }}" hx-target="#categories-list" hx-swap="innerHTML">
    <div class="manage-card-header">
      <input type="color" name="color" value="{{ cat.color }}" class="color-pick">
      <input type="text" name="name" value="{{ cat.name }}" autofocus style="margin:0; flex:1">
      <button type="submit" class="sm">Save</button>
      <button type="button" class="secondary sm" hx-get="/categories/html" hx-target="#categories-list" hx-swap="innerHTML">Cancel</button>
    </div>
  </form>
  <div class="set-items">
    {% set items = cat.description.split(',') if cat.description else [] %}
    {% for item in items %}
      {% set trimmed = item.strip() %}
      {% if trimmed %}<span class="set-chip">{{ trimmed }}</span>{% endif %}
    {% endfor %}
  </div>
</div>
