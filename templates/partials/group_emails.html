<div class="email-table-wrap">
  <table class="email-table">
    <thead>
      <tr>
        <th class="col-check"></th>
        <th class="col-sender">From</th>
        <th class="col-subject">Subject</th>
        <th class="col-date">Date</th>
        <th class="col-ai">AI</th>
        <th class="col-size">Size</th>
      </tr>
    </thead>
    <tbody id="tbody-{{ sid }}">
      {% for email in emails %}
        {% include "partials/email_row.html" %}
      {% endfor %}
      {% if not emails %}
        <tr><td colspan="6" class="empty-cell">No emails in this group.</td></tr>
      {% endif %}
    </tbody>
  </table>
</div>
